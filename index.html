<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remainder Quest</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><rect width='10' height='10' fill='%23ffd23f'/><rect x='2' y='2' width='6' height='6' fill='%23e63946'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#150d2e; --panel:#241546; --panel2:#2f1d5c; --ink:#fff6e0; --mute:#b9a9e6;
  --good:#5cf08b; --bad:#ff5d73; --gold:#ffd23f; --accent:#ff9f1c;
  --px:'Press Start 2P',ui-monospace,monospace; --body:'VT323',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:24px;line-height:1.2;min-height:100vh;overflow-x:hidden;
  background-image:linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px);background-size:32px 32px}
img{image-rendering:pixelated}
#float{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#float img{position:absolute;width:48px;opacity:.14;animation:drift linear infinite}
@keyframes drift{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:var(--px);font-size:clamp(18px,4.6vw,30px);margin:8px 0 4px;line-height:1.3;color:var(--gold);text-shadow:4px 4px 0 #000;letter-spacing:1px}
.sub{color:var(--mute);margin:0 0 16px}
.hud{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1;min-width:110px;background:var(--panel);box-shadow:0 0 0 4px #000;padding:8px 10px}
.stat b{display:block;font-family:var(--px);font-size:14px;color:var(--gold);margin-top:6px}
.stat.hot b{color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{font:inherit;color:var(--ink);background:var(--panel);border:0;box-shadow:0 0 0 3px #000;padding:6px 12px;cursor:pointer;transition:transform .1s,background .15s}
.chip:hover{transform:translateY(-3px);background:var(--panel2)}
.chip[aria-pressed=true]{background:var(--gold);color:#000}
.bar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:16px}
.bar i{height:12px;background:#000;display:block;transition:background .3s,transform .3s}
.bar i.ok{background:var(--good);transform:scaleY(1.4)} .bar i.no{background:var(--bad)} .bar i.now{background:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
.card{background:var(--panel);box-shadow:0 0 0 4px #000,8px 8px 0 4px #000;position:relative;animation:pop .35s steps(5)}
.card::before{content:"";display:block;height:14px;background:var(--accent);transition:background .4s}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.scene{display:flex;gap:18px;align-items:center;padding:18px}
.hero{flex:none;width:96px;height:96px;background:var(--panel2);display:grid;place-items:center;box-shadow:inset 0 0 0 4px #000}
.hero img{width:64px;animation:bob 1.2s steps(4) infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.story{margin:0;font-size:28px}
.q{padding:0 18px 12px;font-size:30px;color:var(--gold)}
.row{display:flex;gap:10px;padding:0 18px 18px;flex-wrap:wrap;align-items:center}
input{font-family:var(--px);font-size:22px;width:140px;padding:12px;background:#0b0620;color:var(--ink);border:0;box-shadow:0 0 0 4px #000;outline:none;text-align:center}
input:focus{box-shadow:0 0 0 4px var(--gold)}
input:disabled{opacity:.6}
.btn{font-family:var(--px);font-size:12px;border:0;background:var(--accent);color:#000;padding:15px 18px;cursor:pointer;box-shadow:0 0 0 3px #000,0 6px 0 3px #000;transition:transform .08s,box-shadow .08s,filter .15s;margin-bottom:6px}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(6px);box-shadow:0 0 0 3px #000,0 0 0 3px #000}
.btn.ghost{background:var(--panel2);color:var(--ink)}
.btn[hidden]{display:none}
:focus-visible{outline:3px dashed #fff;outline-offset:3px}
.hint{padding:0 18px 12px;color:var(--mute);min-height:1.2em}
.fb{margin:0 18px 14px;padding:12px 14px;font-size:26px;box-shadow:0 0 0 3px #000;animation:pop .25s steps(4)}
.fb.ok{background:#12482a;color:var(--good)} .fb.no{background:#4d1220;color:#ffc2cb;animation:pop .25s steps(4),shake .4s .1s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.viz{margin:0 18px 18px;padding:14px;background:#0b0620;box-shadow:inset 0 0 0 3px #000;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.grp{padding:6px;border:3px solid #6a5aa8;display:flex;flex-wrap:wrap;gap:3px;max-width:150px;opacity:0;animation:drop .35s steps(4) forwards;animation-delay:calc(var(--i)*90ms)}
.grp.plate{border-radius:50%;padding:12px;justify-content:center;max-width:130px}
.grp img{width:24px;height:24px}
.grp img.ghost{opacity:.18;filter:grayscale(1)}
.grp.hl{border-color:var(--gold);box-shadow:0 0 0 3px #000,0 0 14px var(--gold);background:rgba(255,210,63,.1)}
.grp.left{border-style:dashed}
.grp small{width:100%;text-align:center;color:var(--mute);font-size:18px}
@keyframes drop{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
.end{padding:28px 18px;text-align:center}
.end h2{font-family:var(--px);font-size:18px;color:var(--gold);margin:0 0 16px}
.stars{font-family:var(--px);font-size:34px;letter-spacing:8px;margin:12px 0}
.stars span{display:inline-block;animation:pop .4s steps(4) backwards}
.p{position:fixed;width:10px;height:10px;pointer-events:none;z-index:9}
@media (max-width:520px){.scene{flex-direction:column;text-align:center}.story{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.grp{opacity:1}}
</style>
</head>
<body>
<div id="float" aria-hidden="true"></div>
<main>
  <h1>REMAINDER QUEST</h1>
  <p class="sub">Integer division and remainders with pizza, donuts, pie, apples, and cookies. Ten questions per round.</p>
  <div class="hud">
    <div class="stat">Score<b id="score">0</b></div>
    <div class="stat hot">Streak<b id="streak">0</b></div>
    <div class="stat">Best streak<b id="best">0</b></div>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Question type"></div>
  <div class="bar" id="bar" aria-hidden="true"></div>
  <section class="card" id="card" aria-live="polite"></section>
</main>

<script>
// ---------- pixel sprites (10x10) ----------
const SPR={
 pizza:{pal:{C:'#b5651d',Y:'#ffd23f',R:'#e63946'},map:["CCCCCCCCCC","CYYYYRYYYC",".YYRYYYYY.",".YYYYYYRY.","..YYRYYY..","..YYYYRY..","...YYYY...","...YRYY...","....YY....","....Y....."]},
 donut:{pal:{D:'#c98a4b',P:'#ff7eb6',S:'#fff6e0'},map:["...DDDD...","..DPPPPD..",".DPPSPPPD.","DPPPPPPSPD","DPSP..PPPD","DPPP..PPPD","DPPPPPPPSD",".DPPSPPPD.","..DPPPPD..","...DDDD..."]},
 pie:{pal:{C:'#8a4b1e',T:'#e8b05a',R:'#e63946'},map:["...CCCC...","..CTTTTC..",".CTTRTTTC.","CTTTTTRTTC","CTRTTTTTTC","CTTTTRTTTC","CTTTTTTRTC",".CTRTTTTC.","..CTTTTC..","...CCCC..."]},
 apple:{pal:{B:'#7a4a21',G:'#4ad66d',R:'#e63946',W:'#ffb3bd'},map:[".....B....","....BG....","..RRBGRR..",".RRRRRRRR.","RRWRRRRRRR","RRWRRRRRRR","RRRRRRRRRR",".RRRRRRRR.","..RRRRRR..","...RR.RR.."]},
 cookie:{pal:{K:'#6b3e1d',C:'#e0a458',D:'#4a2a12'},map:["...KKKK...","..KCCCCK..",".KCCDCCCK.","KCCCCCCDCK","KCDCCCCCCK","KCCCCDCCCK","KCCCCCCCCK",".KCDCCCCK.","..KCCDCK..","...KKKK..."]}
};
const URLS={};
function sprite(n){
  if(URLS[n])return URLS[n];
  const s=SPR[n],c=document.createElement('canvas');c.width=c.height=10;
  const x=c.getContext('2d');
  s.map.forEach((row,y)=>[...row].forEach((ch,i)=>{if(ch!=='.'){x.fillStyle=s.pal[ch];x.fillRect(i,y,1,1)}}));
  return URLS[n]=c.toDataURL();
}
const img=(n,cls='')=>`<img src="${sprite(n)}" alt="" class="${cls}">`;

// ---------- scenarios ----------
const S={
 pizza:{i:'slice',ip:'slices',c:'pizza',cp:'pizzas',ks:[6,8,10,12],col:'#ff9f1c',place:'a pizza party'},
 donut:{i:'donut',ip:'donuts',c:'box',cp:'boxes',ks:[6,8,12],col:'#ff7eb6',place:'a bakery stand'},
 pie:{i:'slice',ip:'slices',c:'pie',cp:'pies',ks:[6,8],col:'#e8b05a',place:'a pie contest'},
 apple:{i:'apple',ip:'apples',c:'bag',cp:'bags',ks:[4,5,6],col:'#e63946',place:'an orchard picnic'},
 cookie:{i:'cookie',ip:'cookies',c:'tray',cp:'trays',ks:[9,12,15],col:'#e0a458',place:'a cookie swap'}
};
const MODES=[['mix','Mixed'],['mod','Leftovers'],['floor','Full groups'],['ceil','How many needed'],['split','Sharing']];
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rand(0,a.length-1)];

function gen(mode){
  const key=pick(Object.keys(S)),s=S[key],k=pick(s.ks);
  const types=mode==='mix'?['mod','floor','ceil','share','srem']:mode==='split'?['share','srem']:[mode];
  const t=pick(types);
  let N,P,g=0;
  do{N=rand(k+2,Math.min(4*k-1,47));P=rand(3,9);g++}while(g<200&&(N%k===0||N%P===0||N<=P));
  const q=Math.floor(N/k),r=N%k,q2=Math.floor(N/P),r2=N%P;
  const story=`${P} people are at ${s.place} with ${N} ${s.ip}. Each ${s.c} holds ${k} ${s.ip}.`;
  const D={
   floor:{q:`How many ${s.cp} are completely full?`,a:q,h:`Count how many whole groups of ${k} fit inside ${N}.`,
     e:`${N} ÷ ${k} = ${q} remainder ${r}. The whole-number part, ${q}, is the count of full ${s.cp}.`},
   mod:{q:`After the full ${s.cp} are counted, how many ${s.ip} are left over?`,a:r,h:`Remove groups of ${k} until fewer than ${k} remain.`,
     e:`${N} mod ${k} = ${r}. The ${q} full ${s.cp} use ${q*k} ${s.ip}, so ${r} are left over.`},
   ceil:{q:`How many ${s.cp} are needed in total to hold all ${N} ${s.ip}?`,a:q+1,h:`A partly filled ${s.c} still counts as one ${s.c}.`,
     e:`${q} full ${s.cp} hold ${q*k}. The ${r} extra ${s.ip} need one more ${s.c}: ${q} + 1 = ${q+1}.`},
   share:{q:`If all ${N} ${s.ip} are shared equally among ${P} people, how many does each person get?`,a:q2,h:`Divide ${N} by ${P} and ignore the remainder.`,
     e:`${N} ÷ ${P} = ${q2} remainder ${r2}. Each person gets ${q2}.`},
   srem:{q:`If all ${N} ${s.ip} are shared equally among ${P} people, how many are left over?`,a:r2,h:`Give each person the same amount, then count what remains.`,
     e:`${N} mod ${P} = ${r2}. After ${q2} each (${q2*P} handed out), ${r2} ${s.ip} remain.`}
  }[t];
  return {key,s,k,N,P,t,q,r,q2,r2,story,...D};
}

function viz(Q){
  const {key,k,N,P,t,q,r,q2,r2,s}=Q;let h='',n=0;
  if(t==='share'||t==='srem'){
    for(let p=0;p<P;p++)h+=`<div class="grp plate ${t==='share'?'hl':''}" style="--i:${n++}">${img(key).repeat(q2)}<small>person ${p+1}</small></div>`;
    h+=`<div class="grp left ${t==='srem'?'hl':''}" style="--i:${n++}">${img(key).repeat(r2)}<small>left over</small></div>`;
  }else{
    for(let b=0;b<q;b++)h+=`<div class="grp ${t==='floor'||t==='ceil'?'hl':''}" style="--i:${n++}">${img(key).repeat(k)}<small>full ${s.c}</small></div>`;
    h+=`<div class="grp left ${t==='mod'||t==='ceil'?'hl':''}" style="--i:${n++}">${img(key).repeat(r)}${img(key,'ghost').repeat(k-r)}<small>${r} of ${k}</small></div>`;
  }
  return h;
}

// ---------- state ----------
let mode='mix',Q,qi=0,score=0,streak=0,right=0,hinted=false,answered=false,marks=[];
let best=0;try{best=+localStorage.getItem('rq-best')||0}catch(e){}
const $=id=>document.getElementById(id);

function hud(){$('score').textContent=score;$('streak').textContent=streak;$('best').textContent=best}
function bar(){$('bar').innerHTML=Array.from({length:10},(_,i)=>`<i class="${marks[i]||(i===qi?'now':'')}"></i>`).join('')}

function chips(){
  $('chips').innerHTML=MODES.map(([m,l])=>`<button class="chip" data-m="${m}" aria-pressed="${m===mode}">${l}</button>`).join('');
  $('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;mode=b.dataset.m;chips();restart()}
}

function restart(){qi=0;score=0;streak=0;right=0;marks=[];hud();next()}

function next(){
  if(qi>=10)return end();
  Q=gen(mode);hinted=false;answered=false;
  document.documentElement.style.setProperty('--accent',Q.s.col);
  $('card').innerHTML=`<div class="scene"><div class="hero">${img(Q.key)}</div><p class="story">${Q.story}</p></div>
   <div class="q">${Q.q}</div>
   <div class="row"><input id="ans" type="number" inputmode="numeric" min="0" aria-label="Answer" autocomplete="off">
   <button class="btn" id="go">CHECK</button><button class="btn ghost" id="hintBtn">HINT</button></div>
   <div class="hint" id="hint"></div><div id="out"></div>`;
  $('card').style.animation='none';void $('card').offsetWidth;$('card').style.animation='';
  $('go').onclick=check;
  $('hintBtn').onclick=()=>{hinted=true;$('hint').textContent=Q.h};
  $('ans').onkeydown=e=>{if(e.key==='Enter')check()};
  $('ans').focus({preventScroll:true});bar();
}

function check(){
  if(answered)return;
  const v=$('ans').value;if(v==='')return $('ans').focus();
  answered=true;const ok=+v===Q.a;
  $('ans').disabled=true;$('go').hidden=true;$('hintBtn').hidden=true;
  if(ok){streak++;right++;score+=(hinted?5:10)+Math.min(streak,5)*2;
    if(streak>best){best=streak;try{localStorage.setItem('rq-best',best)}catch(e){}}
    burst($('go'));
  }else streak=0;
  marks[qi]=ok?'ok':'no';
  $('out').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'Correct! ':`Not quite. The answer is ${Q.a}. `}${Q.e}</div>
   <div class="viz">${viz(Q)}</div>
   <div class="row"><button class="btn" id="nx">${qi===9?'FINISH':'NEXT'}</button></div>`;
  hud();qi++;bar();
  $('nx').onclick=next;$('nx').focus({preventScroll:true});
}

function end(){
  const stars=right>=9?3:right>=6?2:right>=3?1:0;
  $('card').innerHTML=`<div class="end"><h2>ROUND COMPLETE</h2>
   <div class="stars">${[0,1,2].map(i=>`<span style="animation-delay:${i*250}ms;color:${i<stars?'var(--gold)':'#4a3a7a'}">★</span>`).join('')}</div>
   <p>${right} of 10 correct. Score: ${score}. Best streak: ${best}.</p>
   <button class="btn" id="again">PLAY AGAIN</button></div>`;
  if(stars>1)burst($('again'),40);
  $('again').onclick=restart;$('again').focus({preventScroll:true});
}

function burst(el,n=26){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const b=el.getBoundingClientRect(),cols=['#ffd23f','#5cf08b','#ff7eb6','#6ad4ff','#fff'];
  for(let i=0;i<n;i++){
    const d=document.createElement('div');d.className='p';
    d.style.left=b.left+b.width/2+'px';d.style.top=b.top+b.height/2+'px';d.style.background=pick(cols);
    document.body.appendChild(d);
    const a=Math.random()*Math.PI*2,m=60+Math.random()*140;
    d.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*m}px,${Math.sin(a)*m+80}px) rotate(${rand(-360,360)}deg)`,opacity:0}],{duration:800+Math.random()*400,easing:'cubic-bezier(.2,.8,.4,1)'}).onfinish=()=>d.remove();
  }
}

// floating background sprites
(function(){
  const f=$('float'),names=Object.keys(SPR);
  for(let i=0;i<14;i++){
    const e=document.createElement('img');e.src=sprite(names[i%names.length]);
    e.style.left=rand(0,96)+'%';e.style.animationDuration=rand(18,34)+'s';e.style.animationDelay=-rand(0,30)+'s';
    e.style.width=rand(32,64)+'px';f.appendChild(e);
  }
})();

chips();hud();next();
</script>
</body>
</html>
